<style>
:root{
  --navy:#1b2a4a;
  --navy-deep:#0f1826;
  --gold:#c99a3c;
  --gold-soft:rgba(201,154,60,.16);
  --cream:#f4f1ea;
  --ink:#22252b;
  --text:#ffffff;
  --muted:rgba(255,255,255,.55);
  --line:rgba(255,255,255,.14);
  --card:rgba(255,255,255,.06);
  --card-strong:rgba(255,255,255,.12);
  --danger:#c9603c;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
  --glass-blur: blur(24px) saturate(180%);
  --glass-fill: rgba(255,255,255,.09);
  --glass-fill-strong: rgba(255,255,255,.16);
  --glass-border: rgba(255,255,255,.22);
  --glass-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(0,0,0,.15);
  --bg-gradient:
    radial-gradient(60% 45% at 12% 8%, rgba(201,154,60,.22) 0%, transparent 60%),
    radial-gradient(55% 50% at 92% 15%, rgba(90,130,220,.20) 0%, transparent 60%),
    radial-gradient(70% 60% at 50% 100%, rgba(120,80,200,.16) 0%, transparent 60%),
    radial-gradient(120% 90% at 15% 0%, #223258 0%, var(--navy) 45%, var(--navy-deep) 100%);
}
body.light{
  --text:#1c2233;
  --muted:rgba(28,34,51,.55);
  --line:rgba(20,30,50,.12);
  --card:rgba(255,255,255,.55);
  --card-strong:rgba(255,255,255,.75);
  --glass-fill: rgba(255,255,255,.55);
  --glass-fill-strong: rgba(255,255,255,.78);
  --glass-border: rgba(20,30,55,.10);
  --glass-shadow: 0 10px 26px rgba(60,70,100,.14), inset 0 1px 0 rgba(255,255,255,.7), inset 0 -1px 0 rgba(0,0,0,.03);
  --bg-gradient:
    radial-gradient(60% 45% at 12% 8%, rgba(201,154,60,.16) 0%, transparent 60%),
    radial-gradient(55% 50% at 92% 15%, rgba(120,150,230,.16) 0%, transparent 60%),
    radial-gradient(70% 60% at 50% 100%, rgba(160,120,210,.12) 0%, transparent 60%),
    radial-gradient(120% 90% at 15% 0%, #f3f0ea 0%, #eef0f5 45%, #e6e9f2 100%);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;}
body{
  margin:0;
  font-family:'Vazirmatn', sans-serif;
  color:var(--text);
  min-height:100vh;
  overscroll-behavior-y: none;
  position:relative;
  transition: color .25s ease;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  background: var(--bg-gradient);
  transition: background .25s ease;
}
button{font-family:inherit; border:none; cursor:pointer; background:none; color:inherit;}
input, select{font-family:inherit;}

.app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding-top:calc(var(--safe-top) + 14px);
  padding-bottom:calc(var(--safe-bottom) + 78px);
}

/* ---- Top bar ---- */
.topbar{
  padding: 0 18px 10px;
  display:flex; align-items:center; justify-content:space-between;
}
.brand{
  font-weight:900; font-size:20px; letter-spacing:.2px;
  display:flex; align-items:center; gap:8px;
}
.brand .rungs{display:inline-flex; flex-direction:column; gap:2px;}
.brand .rungs i{display:block; height:3px; border-radius:2px; background:var(--gold);}
.brand .rungs i:nth-child(1){width:16px;}
.brand .rungs i:nth-child(2){width:12px;}
.brand .rungs i:nth-child(3){width:8px;}
.brand-sub{font-size:11px; color:var(--muted);}
.topbar-profile{
  display:flex; align-items:center; gap:9px; cursor:pointer;
  background: var(--glass-fill);
  backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  border:1px solid var(--glass-border);
  border-radius:20px; padding:5px 12px 5px 6px;
  box-shadow: var(--glass-shadow);
}

/* ---- Screens ---- */
.screen{display:none; padding: 4px 18px 24px; animation: fadein .25s ease;}
.screen.active{display:block;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.section-title{
  font-size:13px; font-weight:700; color:var(--gold);
  margin: 22px 2px 10px; text-align:right;
}
.card{
  background: var(--glass-fill);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border:1px solid var(--glass-border);
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
  box-shadow: var(--glass-shadow);
  position:relative;
}
.profile-card{
  display:flex; align-items:center; gap:14px;
  background: var(--glass-fill-strong);
  backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
  border:1px solid var(--glass-border);
  border-radius:24px; padding:16px 18px; margin-bottom:18px;
  box-shadow: var(--glass-shadow);
}

/* ---- Bottom nav ---- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0;
  max-width:520px; margin:0 auto;
  display:flex;
  padding: 8px 10px calc(10px + var(--safe-bottom));
}
.tabbar:has(.tabbtn){
  background: rgba(20,30,50,.55);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border:1px solid var(--glass-border);
  border-radius:26px;
  margin:0 12px calc(10px + var(--safe-bottom));
  box-shadow: 0 14px 34px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.22);
}
.tabbtn{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:9px 1px 7px; color:var(--muted); font-size:9.6px; font-weight:700;
  transition:color .2s; min-width:0;
}
.tabbtn span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
.tabbtn.active{color:var(--gold);}
.tabbtn svg{width:21px; height:21px;}

/* ---- Today: ring ---- */
.ring-wrap{display:flex; justify-content:center; padding: 10px 0 4px;}
.ring-label{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
}
.ring-num{font-size:34px; font-weight:900;}
.ring-sub{font-size:11px; color:var(--muted); margin-top:2px;}
.day-title{text-align:center; font-size:22px; font-weight:900; margin-top:4px;}
.day-sub{text-align:center; font-size:12px; color:var(--gold); margin-bottom:6px;}

/* ---- Activity row ---- */
.act-row{
  display:flex; align-items:center; gap:10px;
  padding:11px 4px; border-bottom:1px solid var(--line);
}
.act-row:last-child{border-bottom:none;}
.act-check{
  width:24px; height:24px; border-radius:50%;
  border:2px solid rgba(255,255,255,.3);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:.2s;
}
.act-check.done{background:var(--gold); border-color:var(--gold);}
.act-check svg{width:13px; height:13px; opacity:0; transition:.15s;}
.act-check.done svg{opacity:1;}
.act-icon{width:20px; text-align:center; opacity:.6; font-size:15px; flex-shrink:0;}
.act-title{flex:1; font-size:14px; font-weight:700; text-align:right;}
.act-title .alt-tag{display:block; font-size:10px; font-weight:400; color:var(--muted); margin-top:1px;}
.act-pts{
  font-size:12px; font-weight:800; color:var(--gold);
  background:var(--gold-soft); padding:3px 9px; border-radius:20px; flex-shrink:0;
}
.act-pts.done{background:var(--gold); color:var(--navy-deep);}

/* ---- progress bar ---- */
.pbar-track{height:8px; border-radius:6px; background:rgba(255,255,255,.1); overflow:hidden;}
.pbar-fill{height:100%; background:var(--gold); border-radius:6px; transition:width .4s ease;}

/* ---- Rewards ---- */
.reward-row{
  display:flex; align-items:center; gap:12px;
  padding:14px; border-radius:16px; margin-bottom:10px;
  background:var(--card); border:1px solid var(--line);
}

<script>
/* ===================== پله — Planner App ===================== */

const DAY_KEYS = ["sat","sun","mon","tue","wed","thu","fri"];
const DAY_LABELS = {sat:"شنبه", sun:"یکشنبه", mon:"دوشنبه", tue:"سه‌شنبه", wed:"چهارشنبه", thu:"پنجشنبه", fri:"جمعه"};
const JS_DAY_TO_KEY = {0:"sun",1:"mon",2:"tue",3:"wed",4:"thu",5:"fri",6:"sat"};

/* ---- Jalali (Persian) calendar — offline conversion, no network needed ---- */
const JALALI_MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
function gregorianToJalali(gy, gm, gd){
  const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + g_d_m[gm-1];
  jy += 33 * Math.floor(days/12053);
  days %= 12053;
  jy += 4 * Math.floor(days/1461);
  days %= 1461;
  if(days > 365){
    jy += Math.floor((days-1)/365);
    days = (days-1) % 365;
  }
  let jm, jd;
  if(days < 186){
    jm = 1 + Math.floor(days/31);
    jd = 1 + (days % 31);
  } else {
    jm = 7 + Math.floor((days-186)/30);
    jd = 1 + ((days-186) % 30);
  }
  return [jy, jm, jd];
}
function jalaliOf(dateObj){
  return gregorianToJalali(dateObj.getFullYear(), dateObj.getMonth()+1, dateObj.getDate());
}
function jalaliToGregorian(jy, jm, jd){
  let gy = (jy <= 979) ? 621 : 1600;
  jy -= (jy <= 979) ? 0 : 979;
  let days = (365*jy) + (Math.floor(jy/33)*8) + Math.floor(((jy%33)+3)/4) + 78 + jd + ((jm < 7) ? (jm-1)*31 : ((jm-7)*30)+186);
  gy += 400 * Math.floor(days/146097);
  days %= 146097;
  if(days > 36524){
    gy += 100 * Math.floor(--days/36524);
    days %= 36524;
    if(days >= 365) days++;
  }
  gy += 4 * Math.floor(days/1461);
  days %= 1461;
  if(days > 365){
    gy += Math.floor((days-1)/365);
    days = (days-1) % 365;
  }
  const gd0 = days + 1;
  const isLeapG = (gy%4===0 && gy%100!==0) || gy%400===0;
  const sal_a = [0,31, isLeapG?29:28, 31,30,31,30,31,31,30,31,30,31];
  let gm = 0, gd = gd0;
  for(gm=1; gm<=12; gm++){
    if(gd <= sal_a[gm]) break;
    gd -= sal_a[gm];
  }
  return [gy, gm, gd];
}
function jalaliMonthLength(jy, jm){
  if(jm <= 6) return 31;
  if(jm <= 11) return 30;
  const [gy,gm,gd] = jalaliToGregorian(jy,12,30);
  const back = gregorianToJalali(gy,gm,gd);
  return (back[1]===12 && back[2]===30) ? 30 : 29;
}
const WEEK_ORDER = ["sat","sun","mon","tue","wed","thu","fri"];
function saturdayOf(dateObj){
  const wk = dayKeyOf(dateObj);
  const idx = WEEK_ORDER.indexOf(wk);
  const d = new Date(dateObj);
  d.setDate(d.getDate() - idx);
  return d;
}
const FA_DIGITS = ["۰","۱","۲","۳","۴","۵","۶","۷","۸","۹"];
function toFaDigits(n){
  return String(n).replace(/[0-9]/g, d => FA_DIGITS[+d]);
}
function jalaliDateLabel(dateObj = new Date()){
  const [jy,jm,jd] = jalaliOf(dateObj);
  return `${toFaDigits(jd)} ${JALALI_MONTHS[jm-1]} ${toFaDigits(jy)}`;
}

/* ---- Custom date field: wraps the native <input type=date> so it can never visually overflow.
   The native control is fully transparent and clipped by an overflow:hidden container;
   we render our own Jalali-formatted text on top. ---- */
function dateField(inputId, value, onchangeAttr){
  let display = `<span class="date-display placeholder">انتخاب تاریخ تولد</span>`;
  if(value){
    const [y,m,d] = value.split("-").map(Number);
    if(y && m && d) display = `<span class="date-display">${jalaliDateLabel(new Date(y, m-1, d))}</span>`;
  }
  return `
  <div class="date-field">
    ${display}
    <input type="date" id="${inputId}" value="${value||''}" onchange="${onchangeAttr}">
  </div>`;
}
function onObDateChange(el){
  // Update just the display span in-place so we don't wipe an unsaved name field via a full re-render.
  const span = el.previousElementSibling;

  const [y,m,d] = el.value.split("-").map(Number);
  span.textContent = jalaliDateLabel(new Date(y, m-1, d));
  span.classList.remove("placeholder");
}

/* ---- Monday motivational quotes (rotates daily, deterministic per date) ---- */
const MONDAY_QUOTES = [
  "شروع دوباره هم یه‌جور پیشرفته — همین که برگشتی کافیه.",

  "یه قدم کوچیک امروز، از هزار تا نیت بزرگ فردا بهتره.",
  "هفته رو با یه کار کوچیک ولی واقعی شروع کن، نه با فشار زیاد.",
  "پیشرفت همیشه بلند نیست؛ گاهی فقط ادامه‌دادنه.",

  "هر دوشنبه یه فرصت تازه‌ست، نه یه امتحان.",
  "ثبات از انگیزه مهم‌تره — همین امتیاز کوچیک امروز رو بگیر.",
];
function mondayQuoteFor(dateObj){
  const key = todayKey(dateObj);

  for(let i=0;i<key.length;i++) hash += key.charCodeAt(i);

const MOOD_OPTIONS = ["😞","😐","🙂","😄","🤩"];


function blankProfileData(){
  return {

    history: {},       // dateKey -> [activityId,...]
    moods: {},          // dateKey -> {emoji, text}
    dailyExtra: {},      // dateKey -> {goal, top3:[..], tasks:[..], notes:{..}, goalActions:{short,medium,long}}
    weekly: {},           // weekKey(saturday dateKey) -> {goal, review:{..}}
    goals: {short:[], medium:[], long:[]},

/* Backward-compat helper: old versions stored some fields as a single string; normalize to arrays. */
function toArr(v){
  if(Array.isArray(v)) return v;
  return v ? [v] : [];
}

function normalizeProfileData(d){
  const merged = Object.assign(blankProfileData(), d || {});
  merged.settings = Object.assign(blankProfileData().settings, d && d.settings || {});
  merged.settings.sections = Object.assign(blankProfileData().settings.sections, (d && d.settings && d.settings.sections) || {});
  const g = (d && d.goals) || {};
  merged.goals = {short: toArr(g.short), medium: toArr(g.medium), long: toArr(g.long)};
  return merged;
}

      Object.values(parsed.profiles).forEach(p => { p.data = normalizeProfileData(p.data); });

  // First run: migrate any legacy single-profile data into "profile 1" (kept exactly as-is).
  let legacyData = null;

function ageFromBirthdate(birthdate){
  if(!birthdate) return null;
  const b = new Date(birthdate);
  if(isNaN(b.getTime())) return null;
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if(m < 0 || (m===0 && now.getDate() < b.getDate())) age--;
  return age;
}

function save(){
  PROFILES.profiles[PROFILES.activeId].data = DATA;
  localStorage.setItem(PROFILES_KEY, JSON.stringify(PROFILES));

function todayKey(d = new Date()){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function dayKeyOf(d = new Date()){ return JS_DAY_TO_KEY[d.getDay()]; }

function activitiesForDay(dayKey){
  return DATA.activities.filter(a => a.days.includes("daily") || a.days.includes(dayKey));
}
function completedFor(dateKey){
  return new Set(DATA.history[dateKey] || []);
}
function pointsOf(id){
  const a = DATA.activities.find(a=>a.id===id);
  return a ? a.points : 0;
}
function todayPoints(dateObj = new Date()){
  const dk = todayKey(dateObj);
  const done = completedFor(dk);
  let sum = 0;
  done.forEach(id => sum += pointsOf(id));
  return sum;
}
function maxPointsFor(dayKey){
  const acts = activitiesForDay(dayKey);
  const groups = {};
  let sum = 0;
  acts.forEach(a=>{
    if(a.group){
      groups[a.group] = Math.max(groups[a.group]||0, a.points);
    } else {
      sum += a.points;
    }
  });
  Object.values(groups).forEach(v => sum += v);
  return sum;
}
function totalEverEarned(){
  let sum = 0;
  Object.values(DATA.history).forEach(ids=>{
    ids.forEach(id => sum += pointsOf(id));
  });
  return sum;
}
function cumulativePoints(){
  return Math.max(0, totalEverEarned() - DATA.spent);
}
function sortedRewards(){
  return [...DATA.rewards].sort((a,b)=>a.points-b.points);
}
function nextTier(){
  const cum = cumulativePoints();
  return sortedRewards().find(r => r.points > cum) || null;
}

function toggleActivity(id, dateObj = new Date()){
  const dk = todayKey(dateObj);
  const wk = dayKeyOf(dateObj);
  const list = new Set(DATA.history[dk] || []);
  const activity = DATA.activities.find(a=>a.id===id);
  if(list.has(id)){
    list.delete(id);
  } else {
    if(activity && activity.group){
      // uncheck any sibling in the same exclusive group
      DATA.activities.filter(a=>a.group===activity.group && a.id!==id).forEach(sib => list.delete(sib.id));
    }
    list.add(id);
  }
  DATA.history[dk] = Array.from(list);
  save();
  renderAll();
}

function claimReward(id){
  const tier = DATA.rewards.find(r=>r.id===id);
  if(!tier || cumulativePoints() < tier.points) return;
  if(!confirm(`${tier.points} امتیاز برای «${tier.title}» خرج بشه؟`)) return;
  DATA.spent += tier.points;
  save();
  renderAll();
}

/* ---- Completion feedback: synthesized chime + celebratory toast (no external audio/assets needed) ---- */
function playCompleteChime(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    const ctx = new Ctx();
    const notes = [660, 880, 1175];
    notes.forEach((freq, i) => {
      const t0 = ctx.currentTime + i*0.08;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.22, t0+0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.32);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0+0.34);
    });
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 700);
  }catch(e){ /* audio unavailable — fail silently */ }
}
function triggerCompleteCelebration(){
  const el = document.createElement('div');
  el.className = 'celebrate-toast';
  el.textContent = '✨';
  document.body.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 850);
}

/* ===================== Profile lock: PIN (reliable) + Face ID/Touch ID via WebAuthn (best-effort) =====================
   NOTE: WebAuthn requires a secure context (https, or localhost). If this file is opened directly
   from Safari/Files as a local file (file://), Face ID/Touch ID will NOT be available and the app
   automatically falls back to the PIN — this is expected and handled gracefully below. */
let unlockedProfiles = new Set();

function isLocked(){
  const meta = currentProfileMeta();
  return !!(meta.lock && meta.lock.enabled) && !unlockedProfiles.has(PROFILES.activeId);
}
function simpleHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h<<5)+h) + str.charCodeAt(i); h |= 0; }
  return String(h);
}
function webauthnAvailable(){
  return !!(window.PublicKeyCredential && window.isSecureContext && navigator.credentials);
}

function openLockSetupSheet(){

async function registerBiometric(){
  if(!webauthnAvailable()) return false;
  try{
    const meta = currentProfileMeta();
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: {name:"پله"},
        user: {
          id: crypto.getRandomValues(new Uint8Array(16)),
          name: meta.name || "user",
          displayName: meta.name || "user"
        },
        pubKeyCredParams: [{type:"public-key", alg:-7}],
        authenticatorSelection: {authenticatorAttachment:"platform", userVerification:"required"},
        timeout: 60000
      }
    });
    if(cred){
      meta.lock.webauthnCredId = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
      save();
      return true;
    }
  }catch(e){ /* not available on this device/browser — PIN remains the fallback */ }
  return false;
}
async function tryBiometricUnlock(){
  const meta = currentProfileMeta();
  if(!meta.lock || !meta.lock.webauthnCredId || !webauthnAvailable()) return;
  try{
    const credIdBytes = Uint8Array.from(atob(meta.lock.webauthnCredId), c=>c.charCodeAt(0));
    const assertion = await navigator.credentials.get({
      publicKey:{
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{id:credIdBytes, type:"public-key"}],
        userVerification:"required",
        timeout:60000
      }
    });
    if(assertion){
      unlockedProfiles.add(PROFILES.activeId);
      renderAll();
    }
  }catch(e){ /* user cancelled or it failed — they can still use the PIN */ }
}
function trySubmitPin(pin){
  const meta = currentProfileMeta();
  if(!/^\d{4}$/.test(pin)) return;
  if(meta.lock && simpleHash(pin) === meta.lock.pinHash){
    unlockedProfiles.add(PROFILES.activeId);
    renderAll();
  } else {
    alert('رمز اشتباهه.');
  }
}

];
let tutorialIdx = 0;
function startTutorial(){
  tutorialIdx = 0;
  renderTutorialStep();
}
function renderTutorialStep(){
  const step = TUTORIAL_STEPS[tutorialIdx];
  const isLast = tutorialIdx === TUTORIAL_STEPS.length - 1;
  const dots = TUTORIAL_STEPS.map((_,i)=>`<span style="width:${i===tutorialIdx?16:6}px; height:6px; border-radius:3px; background:${i===tutorialIdx?'var(--gold)':'rgba(255,255,255,.2)'}; display:inline-block; transition:.2s;"></span>`).join(" ");
  openOverlay(`
    <div style="text-align:center; padding:10px 6px 4px;">
      <div style="font-size:44px; margin-bottom:14px;">${step.emoji}</div>
      <div style="font-size:17px; font-weight:900; margin-bottom:10px;">${step.title}</div>
      <div style="font-size:13px; color:var(--muted); line-height:1.9; margin-bottom:22px;">${step.body}</div>
      <div style="display:flex; justify-content:center; gap:5px; margin-bottom:20px;">${dots}</div>
    </div>
    <div class="sheet-actions">
      ${isLast ? `` : `<button class="btn btn-ghost" onclick="finishTutorial()">رد کردن</button>`}
      <button class="btn btn-primary" onclick="${isLast?'finishTutorial()':'nextTutorialStep()'}">${isLast?'شروع کن':'بعدی'}</button>
    </div>
  `);
}
function nextTutorialStep(){
  tutorialIdx++;
  if(tutorialIdx >= TUTORIAL_STEPS.length){ finishTutorial(); return; }
  renderTutorialStep();
}
function finishTutorial(){
  DATA.seenTutorial = true;
  save();
  closeOverlay();
}

function ring(points, max){
  const r = 68, c = 2*Math.PI*r;
  const pct = max>0 ? Math.min(points/max,1) : 0;
  return `
  <div class="ring-wrap" style="position:relative;">
    <svg width="160" height="160" viewBox="0 0 160 160">
      <circle cx="80" cy="80" r="${r}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="13"/>
      <circle cx="80" cy="80" r="${r}" fill="none" stroke="#c99a3c" stroke-width="13"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}"
        transform="rotate(-90 80 80)" style="transition:stroke-dashoffset .5s ease;"/>
    </svg>
    <div class="ring-label">
      <div class="ring-num">${points}</div>
      <div class="ring-sub">از ${max} امتیاز</div>
    </div>
  </div>`;
}

function renderToday(){
  const now = new Date();
  const dk = dayKeyOf(now);
  const done = completedFor(todayKey(now));
  const acts = activitiesForDay(dk);
  const rotating = acts.filter(a => !a.days.includes("daily"));
  const core = acts.filter(a => a.days.includes("daily"));
  const pts = todayPoints(now);
  const max = maxPointsFor(dk);

  const rowHtml = (a) => {
    const isDone = done.has(a.id);
    return `
    <div class="act-row" onclick="toggleActivity('${a.id}')">
      <div class="act-check ${isDone?'done':''}">${ICONS.check}</div>
      <div class="act-icon">${a.icon||"•"}</div>
      <div class="act-title">${a.title}${a.group?`<span class="alt-tag">یکی از گزینه‌های این بخش</span>`:""}</div>
      <div class="act-pts ${isDone?'done':''}">+${a.points}</div>
    </div>`;
  };

  const cum = cumulativePoints();
  const next = nextTier();
  const ladderTarget = next ? next.points : (sortedRewards().slice(-1)[0]?.points || 1);

  const mood = moodFor(todayKey(now));
  const moodChips = MOOD_OPTIONS.map(e => `
    <button type="button" class="mood-emoji ${mood.emoji===e?'on':''}" onclick="setMoodEmoji('${e}')">${e}</button>
  `).join("");

  const extra = dailyExtraFor(todayKey(now));

  const priorityLabel = {urgent:"ضروری", important:"مهم", deferrable:"قابل‌تعویق"};
  const sortedTasks = [...extra.tasks].sort((a,b) => (b.starred?1:0) - (a.starred?1:0));
  const taskRows = sortedTasks.length ? sortedTasks.map(t => `
    <div class="task-row">
      <div class="task-check ${t.done?'done':''}" onclick="toggleTask('${t.id}')">${ICONS.check}</div>
      <div class="task-text ${t.done?'done':''}">${t.text}</div>
      <div class="priority-tag priority-${t.priority}">${priorityLabel[t.priority]}</div>
      <button class="star-btn ${t.starred?'on':''}" onclick="toggleStar('${t.id}')">${t.starred?ICONS.starFilled:ICONS.starOutline}</button>
      <button class="icon-btn" style="width:24px;height:24px;" onclick="deleteTask('${t.id}')">${ICONS.trash}</button>
    </div>`).join("") : `<div class="empty">کاری اضافه نکردی</div>`;

  const meta = currentProfileMeta();
  const age = ageFromBirthdate(meta.birthdate);
  const sec = DATA.settings.sections;

  const blocks = [];
  blocks.push(`
    <div class="profile-card" onclick="openGoalsSheet()" style="cursor:pointer;">
      <div class="avatar avatar-lg">${meta.photo ? `<img src="${meta.photo}">` : "🙂"}</div>
      <div style="flex:1; text-align:right;">
        <div style="font-size:16px; font-weight:900;">${meta.name}</div>
        ${age!==null ? `<div style="font-size:11.5px; color:var(--muted); margin-top:2px;">${toFaDigits(age)} ساله</div>` : ``}
        <div style="font-size:10.5px; color:var(--gold); margin-top:4px;">🎯 اهداف و هدف امروز — بزن ببین</div>
      </div>
    </div>

    <div class="day-title">${DAY_LABELS[dk]}</div>
    <div class="day-sub">${jalaliDateLabel(now)}</div>
    ${ring(pts, max)}

    ${dk==="mon" ? `<div class="quote-card">💬 ${mondayQuoteFor(now)}</div>` : ``}
  `);

  if(sec.tasks) blocks.push(`
    <div class="section-title">⭐ کارهای امروز</div>
    <div class="card">
      ${taskRows}
      <button class="fab" onclick="openTaskForm()">+ افزودن کار</button>
    </div>
    <div class="note" style="padding:0 4px; margin-top:-6px;">روی ستاره بزن تا به‌عنوان یکی از ۳ کار مهم امروز مشخصش کنی.</div>`);

  if(sec.mainActivity) blocks.push(`
    <div class="section-title">فعالیت اصلی امروز</div>
    <div class="card">
      ${rotating.length ? rotating.map(rowHtml).join("") : `<div class="empty">امروز فعالیت چرخشی نداری</div>`}
    </div>`);

  if(sec.coreActivities) blocks.push(`
    <div class="section-title">پایه‌های روزانه</div>
    <div class="card">
      ${core.map(rowHtml).join("")}
    </div>`);

  if(sec.notes) blocks.push(`
    <div class="section-title">📝 یادداشت‌های امروز</div>
    <div class="card">
      <div class="note-field"><label>ایده‌ها</label>${renderListField(extra.notes.ideas, "addNoteItem('ideas', v)", "deleteNoteItem('ideas', ", "هر ایده‌ای که به ذهنت رسید")}</div>
      <div class="note-field"><label>یادداشت سریع</label>${renderListField(extra.notes.quick, "addNoteItem('quick', v)", "deleteNoteItem('quick', ", "یه یادداشت کوتاه")}</div>
      <div class="note-field"><label>اتفاق مهم روز</label>${renderListField(extra.notes.important, "addNoteItem('important', v)", "deleteNoteItem('important', ", "مهم‌ترین اتفاق امروز")}</div>
      <div class="note-field" style="margin-bottom:0;"><label>فردا یادم باشه</label>${renderListField(extra.notes.tomorrow, "addNoteItem('tomorrow', v)", "deleteNoteItem('tomorrow', ", "چیزی که نباید فراموش کنی")}</div>
    </div>`);

  if(sec.mood) blocks.push(`
    <div class="section-title">حال امروز</div>
    <div class="card">
      <div class="mood-row">${moodChips}</div>
      <textarea class="mood-text" placeholder="امروز چطور بود؟ (اختیاری)" onchange="setMoodText(this.value)">${mood.text||""}</textarea>
    </div>`);

  if(sec.ladder) blocks.push(`
    <div class="section-title">تا جایزه بعدی</div>
    <div class="card">
      <div class="row-between" style="margin-bottom:8px;">
        <div style="font-size:12px; color:var(--muted);">${next ? next.title : "همه‌ی جایزه‌ها گرفته شد 🎉"}</div>
        <div style="font-size:13px; font-weight:800; color:var(--gold);">${cum}/${ladderTarget}</div>
      </div>
      <div class="pbar-track"><div class="pbar-fill" style="width:${Math.min(cum/ladderTarget*100,100)}%"></div></div>
    </div>`);

  return blocks.join("");
}

  const cum = cumulativePoints();

    return `

}

let calState = null; // {jy, jm} — lazily initialized to current Jalali month
let weekState = null; // Date (a Saturday) — lazily initialized to this week's Saturday

function ensureCalState(){
  if(!calState){
    const [jy,jm] = jalaliOf(new Date());
    calState = {jy, jm};
  }
}
function shiftCalMonth(delta){
  ensureCalState();
  let {jy, jm} = calState;
  jm += delta;
  if(jm > 12){ jm = 1; jy++; }
  if(jm < 1){ jm = 12; jy--; }
  calState = {jy, jm};
  renderAll();
}

function renderCalendar(){
  ensureCalState();
  const {jy, jm} = calState;
  const monthLen = jalaliMonthLength(jy, jm);
  const [firstGy, firstGm, firstGd] = jalaliToGregorian(jy, jm, 1);
  const firstDate = new Date(firstGy, firstGm-1, firstGd);
  const startOffset = WEEK_ORDER.indexOf(dayKeyOf(firstDate));
  const todayDk = todayKey(new Date());

  let monthTotal = 0, activeDays = 0, bestDay = {points:0, label:""};
  const cells = [];
  const dayPoints = []; // for the progress chart
  const monthEvents = []; // for the at-a-glance list
  for(let i=0;i<startOffset;i++) cells.push(`<div class="cal-cell empty"></div>`);
  for(let d=1; d<=monthLen; d++){
    const [gy,gm,gd] = jalaliToGregorian(jy, jm, d);
    const dObj = new Date(gy, gm-1, gd);
    const dk = todayKey(dObj);
    const ids = DATA.history[dk] || [];
    const pts = ids.reduce((s,id)=>s+pointsOf(id), 0);
    const isToday = dk === todayDk;
    const evs = eventsFor(dk);
    dayPoints.push(pts);
    if(pts > 0){
      monthTotal += pts; activeDays += 1;
      if(pts > bestDay.points) bestDay = {points:pts, label: `${toFaDigits(d)} ${JALALI_MONTHS[jm-1]}`};
    }
    evs.forEach(e => monthEvents.push({day:d, title:e.title}));
    cells.push(`
      <div class="cal-cell ${pts>0?'has-points':''} ${isToday?'today':''}" onclick="openDayDetail('${dk}')">
        ${toFaDigits(d)}
        ${pts>0?`<span class="dot pts-dot"></span>`:""}
        ${evs.length?`<span class="dot event-dot"></span>`:""}
      </div>`);
  }
  const avg = activeDays ? Math.round(monthTotal/activeDays) : 0;
  const dowRow = WEEK_ORDER.map(k=>`<div class="cal-dow">${DAY_LABELS[k].slice(0,1)}</div>`).join("");

  const maxPts = Math.max(...dayPoints, 1);
  const chartW = 300, chartH = 70, barGap = 2;
  const barW = (chartW - (monthLen-1)*barGap) / monthLen;
  const bars = dayPoints.map((p,i)=>{
    const h = Math.max((p/maxPts)*chartH, p>0?3:1);
    const x = i*(barW+barGap);
    const y = chartH - h;
    const isToday = (i+1) === Number(todayKey(new Date()).split("-")[2]) && jy===jalaliOf(new Date())[0] && jm===jalaliOf(new Date())[1];
    return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="1.5" fill="${p>0?(isToday?'#c99a3c':'rgba(201,154,60,.55)'):'rgba(255,255,255,.12)'}"/>`;
  }).join("");

  monthEvents.sort((a,b)=>a.day-b.day);
  const eventsListHtml = monthEvents.length ? monthEvents.map(e=>`
    <div class="event-row">
      <div class="event-day">${toFaDigits(e.day)}</div>
      <div class="event-title">${e.title}</div>
    </div>`).join("") : `<div class="empty">هنوز مناسبتی برای این ماه ثبت نشده</div>`;

  return `
    <div class="section-title" style="margin-top:6px;">تقویم</div>
    <div class="card">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="shiftCalMonth(1)">${ICONS.chevronRight}</button>
        <div class="cal-title">${JALALI_MONTHS[jm-1]} ${toFaDigits(jy)}</div>
        <button class="cal-nav-btn" onclick="shiftCalMonth(-1)">${ICONS.chevronLeft}</button>
      </div>
      <div class="cal-grid">${dowRow}${cells.join("")}</div>
      <div class="cal-legend">
        <span><span class="legend-dot" style="background:var(--gold);"></span> روز فعال</span>
        <span><span class="legend-dot" style="background:#6ea8ff;"></span> مناسبت</span>
        <span><span class="legend-dot" style="background:rgba(255,255,255,.15);"></span> روز خالی</span>
      </div>
    </div>

    <div class="section-title">نمودار پیشرفت ماهانه</div>
    <div class="card">
      <svg viewBox="0 0 ${chartW} ${chartH}" width="100%" height="70" preserveAspectRatio="none">${bars}</svg>
    </div>

    <div class="section-title">آمار همین ماه</div>
    <div class="card">
      <div class="stat-grid">
        <div class="stat-box"><div class="stat-num">${toFaDigits(monthTotal)}</div><div class="stat-lbl">جمع امتیاز</div></div>
        <div class="stat-box"><div class="stat-num">${toFaDigits(activeDays)}</div><div class="stat-lbl">روز فعال</div></div>
        <div class="stat-box"><div class="stat-num">${toFaDigits(avg)}</div><div class="stat-lbl">میانگین روز</div></div>
      </div>
      ${bestDay.points>0 ? `<div class="note" style="margin-top:14px;">بهترین روز این ماه: <b style="color:var(--gold)">${bestDay.label}</b> با ${toFaDigits(bestDay.points)} امتیاز 🎉</div>` : ``}
    </div>

    <div class="section-title">مناسبت‌های این ماه — یه نگاه</div>
    <div class="card">${eventsListHtml}</div>
  `;
}

    ${extra.tasks.length ? `

/* ===================== Weekly tab ===================== */

function ensureWeekState(){
  if(!weekState) weekState = saturdayOf(new Date());
}
function shiftWeek(deltaDays){
  ensureWeekState();
  const d = new Date(weekState);
  d.setDate(d.getDate() + deltaDays);
  weekState = d;
  renderAll();
}

function renderWeekly(){
  ensureWeekState();
  const start = weekState;
  const wk = weekKeyOf(start);
  const w = weeklyFor(wk);
  const todayDk = todayKey(new Date());

  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(start);
    d.setDate(d.getDate()+i);
    days.push(d);
  }
  let weekTotal = 0;
  const dayRows = days.map(d=>{
    const dkey = todayKey(d);
    const wkkey = dayKeyOf(d);
    const pts = todayPoints(d);
    weekTotal += pts;
    const mx = Math.max(maxPointsFor(wkkey), 1);
    const pct = Math.min(pts/mx*100, 100);
    const isToday = dkey === todayDk;
    return `
    <div class="week-bar-row">
      <div class="week-bar-pts">${toFaDigits(pts)}</div>
      <div class="pbar-track" style="flex:1;"><div class="pbar-fill" style="width:${pct}%"></div></div>
      <div class="week-bar-day" style="${isToday?'color:var(--gold); font-weight:900;':''}">${DAY_LABELS[wkkey]}</div>
    </div>`;
  }).join("");

  const endLabel = jalaliDateLabel(days[6]);
  const startLabel = jalaliDateLabel(days[0]);

  return `
    <div class="section-title" style="margin-top:6px;">مرور هفتگی</div>
    <div class="card">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="shiftWeek(7)">${ICONS.chevronRight}</button>
        <div class="cal-title" style="font-size:13px;">${startLabel} تا ${endLabel}</div>
        <button class="cal-nav-btn" onclick="shiftWeek(-7)">${ICONS.chevronLeft}</button>
      </div>
      <div style="text-align:center; margin:14px 0;">
        <span class="xp-badge">${toFaDigits(weekTotal)} XP</span>
      </div>
      ${dayRows}
    </div>

    <div class="section-title">🎯 این هفته باید به کجا برسم؟</div>
    <div class="card">
      <input type="text" class="goal-input" value="${(w.goal||"").replace(/"/g,'&quot;')}" placeholder="هدف اصلی این هفته" onchange="saveWeekly('${wk}', {goal:this.value})">
    </div>

    <div class="section-title">📈 مرور آخر هفته</div>
    <div class="card">
      <div class="note-field"><label>این هفته چه کارهایی انجام دادم؟</label><textarea onchange="saveWeekly('${wk}', {review:Object.assign(weeklyFor('${wk}').review,{done:this.value})})">${w.review.done}</textarea></div>
      <div class="note-field"><label>چه چیزی عقب افتاد؟</label><textarea onchange="saveWeekly('${wk}', {review:Object.assign(weeklyFor('${wk}').review,{delayed:this.value})})">${w.review.delayed}</textarea></div>
      <div class="note-field"><label>بزرگ‌ترین دستاورد؟</label><textarea onchange="saveWeekly('${wk}', {review:Object.assign(weeklyFor('${wk}').review,{achievement:this.value})})">${w.review.achievement}</textarea></div>
      <div class="note-field"><label>چه چیزی وقتم رو گرفت؟</label><textarea onchange="saveWeekly('${wk}', {review:Object.assign(weeklyFor('${wk}').review,{timeSink:this.value})})">${w.review.timeSink}</textarea></div>
      <div class="note-field" style="margin-bottom:0;"><label>هفته بعد روی چی تمرکز کنم؟</label><textarea onchange="saveWeekly('${wk}', {review:Object.assign(weeklyFor('${wk}').review,{nextFocus:this.value})})">${w.review.nextFocus}</textarea></div>
    </div>
  `;
}

        <div class="step-desc">کروم معمولاً خودش هم یه پیشنهاد نصب پایین صفحه نشون می‌ده — می‌تونی همونو هم بزنی.</div></div>
      </div>
      ` : `
      <div class="step">
        <div class="step-num">۱</div>
        <div class="step-body"><div class="step-title">این صفحه رو تو Safari باز کن</div>
        <div class="step-desc">حتماً Safari — مرورگرهای دیگه تو آیفون این قابلیت رو ندارن.</div></div>
      </div>
      <div class="step">
        <div class="step-num">۲</div>
        <div class="step-body"><div class="step-title">دکمه‌ی Share رو بزن</div>
        <div class="step-desc">همون آیکون مربع با فلش رو به بالا، پایین صفحه.</div></div>
      </div>
      <div class="step">
        <div class="step-num">۳</div>
        <div class="step-body"><div class="step-title">«Add to Home Screen» رو انتخاب کن</div>
        <div class="step-desc">از این به بعد «پله» یه آیکون مستقل رو صفحه اصلیته، بدون نوار آدرس، دقیقاً مثل یه اپ.</div></div>
      </div>
      `}
      <div class="note" style="margin-top:6px;">توجه: وب‌اپ‌ها نمی‌تونن ویجت روی صفحه اصلی داشته باشن — این قابلیت فقط مخصوص اپ‌های نصب‌شده از استورهای رسمیه.</div>
    </div>

    <div class="section-title">داده‌ها</div>
    <div class="card">
      <div class="row-between" style="margin-bottom:14px;">
        <div style="font-size:13px;">پشتیبان‌گیری (دانلود فایل)</div>
        <button class="btn btn-ghost" style="flex:none; padding:9px 16px; font-size:12.5px;" onclick="exportData()">دانلود</button>
      </div>
      <div class="row-between">
        <div style="font-size:13px;">شروع از اول (پاک کردن همه‌چیز)</div>
        <button class="btn btn-danger" style="flex:none; padding:9px 16px; font-size:12.5px;" onclick="resetAll()">پاک‌سازی</button>
      </div>
    </div>
  `;
}

/* ===================== Forms (add/edit) ===================== */

function openOverlay(html){
  document.getElementById("sheet").innerHTML = html;
  document.getElementById("overlay").classList.add("show");
}
function closeOverlay(){
  document.getElementById("overlay").classList.remove("show");
}

function openActivityForm(id){
  const a = id ? DATA.activities.find(x=>x.id===id) : null;
  const days = a ? a.days : [];
  const isDaily = days.includes("daily");
  document.body.dataset.editingActivity = id || "";
  document.body.dataset.tempDays = JSON.stringify(isDaily ? [] : days);
  document.body.dataset.tempDaily = isDaily ? "1" : "0";

  openOverlay(`
    <h3>${a ? "ویرایش فعالیت" : "فعالیت جدید"}</h3>
    <div class="field">
      <label>عنوان</label>
      <input type="text" id="f_title" value="${a?a.title:''}" placeholder="مثلاً: یوگا">
    </div>
    <div class="field">
      <label>امتیاز</label>
      <input type="number" id="f_points" value="${a?a.points:10}" min="1" max="100">
    </div>
    <div class="field">
      <label>چه روزهایی؟</label>
      <div class="days-grid" id="daysGrid"></div>
    </div>
    <div class="sheet-actions">
      ${a ? `<button class="btn btn-danger" onclick="deleteActivity('${id}'); closeOverlay();">حذف</button>` : `<button class="btn btn-ghost" onclick="closeOverlay()">انصراف</button>`}
      <button class="btn btn-primary" onclick="saveActivityForm()">ذخیره</button>
    </div>
  `);
  renderDaysGrid();
}

function renderDaysGrid(){
  const isDaily = document.body.dataset.tempDaily === "1";
  const sel = JSON.parse(document.body.dataset.tempDays || "[]");
  const chips = [`<button type="button" class="day-toggle ${isDaily?'on':''}" onclick="toggleDailyChip()">هرروز</button>`]
    .concat(DAY_KEYS.map(dk => `<button type="button" class="day-toggle ${(!isDaily && sel.includes(dk))?'on':''}" onclick="toggleDayChip('${dk}')" ${isDaily?'style="opacity:.35;pointer-events:none;"':''}>${DAY_LABELS[dk]}</button>`));
  document.getElementById("daysGrid").innerHTML = chips.join("");
}
function toggleDailyChip(){
  const isDaily = document.body.dataset.tempDaily === "1";
  document.body.dataset.tempDaily = isDaily ? "0" : "1";
  if(!isDaily) document.body.dataset.tempDays = "[]";
  renderDaysGrid();
}
function toggleDayChip(dk){
  if(document.body.dataset.tempDaily === "1") return;
  let sel = JSON.parse(document.body.dataset.tempDays || "[]");
  sel = sel.includes(dk) ? sel.filter(x=>x!==dk) : [...sel, dk];
  document.body.dataset.tempDays = JSON.stringify(sel);
  renderDaysGrid();
}
function saveActivityForm(){
  const title = document.getElementById("f_title").value.trim();
  const points = parseInt(document.getElementById("f_points").value) || 0;
  const isDaily = document.body.dataset.tempDaily === "1";
  const sel = JSON.parse(document.body.dataset.tempDays || "[]");
  if(!title || points<=0 || (!isDaily && sel.length===0)){
    alert("عنوان، امتیاز و حداقل یه روز رو مشخص کن.");
    return;
  }
  const days = isDaily ? ["daily"] : sel;
  const editingId = document.body.dataset.editingActivity;

  if(editingId){
    const a = DATA.activities.find(x=>x.id===editingId);
    a.title = title; a.points = points; a.days = days;
  } else {
    const id = "custom_" + (DATA.nextActivitySeq++);
    DATA.activities.push({id, title, points, days, icon:"⭐", group:null});
  }
  save();
  closeOverlay();
  renderAll();
}
function deleteActivity(id){
  if(!confirm("این فعالیت حذف بشه؟")) return;
  DATA.activities = DATA.activities.filter(a=>a.id!==id);
  save();
  closeOverlay();
  renderAll();
}

function openRewardForm(id){
  const r = id ? DATA.rewards.find(x=>x.id===id) : null;
  document.body.dataset.editingReward = id || "";
  openOverlay(`
    <h3>${r ? "ویرایش جایزه" : "جایزه جدید"}</h3>
    <div class="field">
      <label>عنوان جایزه</label>
      <input type="text" id="r_title" value="${r?r.title:''}" placeholder="مثلاً: یه بازی جدید">
    </div>
    <div class="field">
      <label>امتیاز لازم</label>
      <input type="number" id="r_points" value="${r?r.points:100}" min="1">
    </div>
    <div class="sheet-actions">
      ${r ? `<button class="btn btn-danger" onclick="deleteReward(${id}); closeOverlay();">حذف</button>` : `<button class="btn btn-ghost" onclick="closeOverlay()">انصراف</button>`}
      <button class="btn btn-primary" onclick="saveRewardForm()">ذخیره</button>
    </div>
  `);
}
function saveRewardForm(){
  const title = document.getElementById("r_title").value.trim();
  const points = parseInt(document.getElementById("r_points").value) || 0;
  if(!title || points<=0){ alert("عنوان و امتیاز رو درست وارد کن."); return; }
  const editingId = document.body.dataset.editingReward;
  if(editingId){
    const r = DATA.rewards.find(x=>x.id==editingId);
    r.title = title; r.points = points;
  } else {
    DATA.rewards.push({id: DATA.nextRewardId++, title, points});
  }
  save();
  closeOverlay();
  renderAll();
}
function deleteReward(id){
  if(!confirm("این جایزه حذف بشه؟")) return;
  DATA.rewards = DATA.rewards.filter(r=>r.id!=id);
  save();
  closeOverlay();
  renderAll();
}

function openTaskForm(){
  document.body.dataset.tempPriority = "important";
  openOverlay(`
    <h3>کار جدید</h3>
    <div class="field">
      <label>عنوان کار</label>
      <input type="text" id="t_text" placeholder="مثلاً: پاسخ به ایمیل مشتری">
    </div>
    <div class="field">
      <label>اولویت</label>
      <div class="priority-picker" id="priorityPicker"></div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="closeOverlay()">انصراف</button>
      <button class="btn btn-primary" onclick="saveTaskForm()">افزودن</button>
    </div>
  `);
  renderPriorityPicker();
}
function renderPriorityPicker(){
  const cur = document.body.dataset.tempPriority;
  const opts = [["urgent","ضروری"],["important","مهم"],["deferrable","قابل‌تعویق"]];
  document.getElementById("priorityPicker").innerHTML = opts.map(([k,l])=>`
    <button type="button" class="priority-opt ${k} ${cur===k?'on':''}" onclick="pickPriority('${k}')">${l}</button>
  `).join("");
}
function pickPriority(k){
  document.body.dataset.tempPriority = k;
  renderPriorityPicker();
}
function saveTaskForm(){
  const text = document.getElementById("t_text").value;
  const priority = document.body.dataset.tempPriority || "important";
  if(!text.trim()){ alert("عنوان کار رو بنویس."); return; }
  addTask(text, priority);
  closeOverlay();
  renderAll();
}

/* ===================== Settings actions ===================== */

const SECTION_LABELS = {
  tasks: "کارهای امروز (⭐ برای مهم‌ترین‌ها)",
  mainActivity: "فعالیت اصلی امروز (چرخشی)",
  coreActivities: "پایه‌های روزانه",
  notes: "یادداشت‌های امروز",
  mood: "حال امروز",
  ladder: "نوار تا جایزه بعدی"
};
function sectionToggleRows(){
  const sec = DATA.settings.sections;
  return Object.keys(SECTION_LABELS).map(key => `
    <div class="row-between" style="padding:9px 0; border-bottom:1px solid var(--line);">
      <div class="switch ${sec[key]?'on':''}" onclick="toggleSection('${key}')"></div>
      <div style="font-size:13px;">${SECTION_LABELS[key]}</div>
    </div>`).join("");
}
function toggleSection(key){
  DATA.settings.sections[key] = !DATA.settings.sections[key];
  save();
  renderAll();
}

function toggleNotif(){
  const s = DATA.settings;
  if(!s.notifEnabled){
    if("Notification" in window){
      Notification.requestPermission().then(perm=>{
        s.notifEnabled = perm === "granted";
        save(); renderAll();
      });
      return;
    }
  }
  s.notifEnabled = !s.notifEnabled;
  save(); renderAll();
}
function setNotifTime(val){
  const m = val.match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return;
  DATA.settings.notifHour = Math.min(23, parseInt(m[1]));
  DATA.settings.notifMinute = Math.min(59, parseInt(m[2]));
  save();
}
function exportData(){
  const meta = currentProfileMeta();
  const payload = {name: meta.name, birthdate: meta.birthdate, photo: meta.photo, data: DATA};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `peleh-backup-${meta.name||'profile'}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function resetAll(){
  if(!confirm("همه‌ی امتیازها، تاریخچه و تنظیمات این کاربر پاک میشه (نه بقیه‌ی کاربرها). مطمئنی؟")) return;
  DATA = blankProfileData();
  save();
  renderAll();
}

/* ===================== Best-effort notification loop ===================== */

function checkNotifTick(){
  const s = DATA.settings;
  if(!s.notifEnabled || !("Notification" in window) || Notification.permission!=="granted") return;
  const now = new Date();
  const dk = dayKeyOf(now);
  if(dk==="thu" || dk==="fri") return;
  const todayStr = todayKey(now);
  if(s.lastNotifiedDate === todayStr) return;
  if(now.getHours()===s.notifHour && now.getMinutes()===s.notifMinute){
    new Notification("وقتشه 💪", {body:"فعالیت اصلی امروزت تو «پله» منتظرته."});
    s.lastNotifiedDate = todayStr;
    save();
  }
}
setInterval(checkNotifTick, 30000);

/* ===================== Boot ===================== */
applyTheme();
renderAll();

</script>
