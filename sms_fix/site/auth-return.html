<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>بازگشت به اپ پله</title>
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <link rel="stylesheet" href="peleh-theme.css" />
  <style>
    @font-face{ font-family:'Vazirmatn'; src:url('fonts/Vazirmatn-Variable.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
    body{font-family:'Vazirmatn',tahoma,sans-serif; text-align:center; padding:48px 18px; background:var(--bg); color:var(--text); line-height:1.8;}
    a.btn{display:inline-block; margin-top:18px; padding:14px 26px; border-radius:16px; background:var(--gold); color:var(--on-gold); font-weight:800; text-decoration:none; font-size:16px;}
    p.small{font-size:13px; color:var(--muted); line-height:1.9;}
  </style>
</head>
<body>
  <p id="msg">ورود با گوگل انجام شد — در حال بازگشت به اپ پله...</p>
  <a class="btn" id="open" href="#" style="display:none">بازگشت به اپ پله</a>
  <p class="small" id="hint" style="display:none">اگه خودکار برنگشت، دکمه‌ی بالا رو بزن.</p>
  <script>
    // «ورود با گوگل» در نسخه‌ی اندروید: Supabase بعد از ورود به این صفحه برمی‌گرده (توکن‌ها تو
    // بخش # آدرس هستن و هیچ‌وقت به سرور فرستاده نمی‌شن). این صفحه همون‌ها رو با دیپ‌لینک به اپ
    // می‌ده. intent:// با package مشخص، تا هیچ اپ دیگه‌ای نتونه توکن‌ها رو بگیره.
    // یادت باشه این آدرس رو تو Supabase → Authentication → URL Configuration → Redirect URLs اضافه کنی.
    (function () {
      var hash = (location.hash || '').replace(/^#/, '');
      var query = (location.search || '').replace(/^\?/, '');
      if (!hash && !query) { document.getElementById('msg').textContent = 'اطلاعات ورود پیدا نشد — دوباره از داخل اپ امتحان کن.'; return; }
      var tail = (query ? '?' + query : '') + (hash ? '#' + hash : '');
      var isAndroid = /Android/i.test(navigator.userAgent);
      var link;
      if (isAndroid) {
        // در intent URL، بخش # خودش جداکننده‌ی Intent هست؛ پس توکن‌ها به‌صورت query فرستاده می‌شن
        var q = [query, hash].filter(Boolean).join('&');
        link = 'intent://auth-callback?' + q + '#Intent;scheme=pelehapp;package=ir.pelehapp.app;end';
      } else {
        link = 'pelehapp://auth-callback' + tail;
      }
      // توکن‌ها رو از نوار آدرس/تاریخچه‌ی مرورگر پاک کن
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
      var a = document.getElementById('open');
      a.href = link;
      a.style.display = 'inline-block';
      document.getElementById('hint').style.display = 'block';
      location.href = link;
    })();
  </script>
</body>
</html>
