<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>در حال انتقال به درگاه پرداخت...</title>
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="origin" />
</head>
<body style="font-family:tahoma,sans-serif; text-align:center; padding:40px 16px;">
  <p id="msg">در حال انتقال به درگاه پرداخت...</p>
  <script>
    // این صفحه فقط یه واسطه‌ست: لینک درگاه رو از پارامتر url می‌گیره و بهش می‌ره تا زیبال
    // Referrer معتبر دامنه‌ی app.pelehapp.ir رو ببینه.
    // امنیت: قبلاً هر آدرسی (حتی javascript:...) قبول می‌شد؛ یعنی با یه لینک ساختگی می‌شد کاربر رو
    // به سایت فیشینگ فرستاد یا کد دلخواه روی دامنه‌ی خودمون اجرا کرد و توکن ورودش رو دزدید.
    // الان فقط https و فقط دامنه‌های زیبال مجازن.
    (function () {
      var target = new URLSearchParams(window.location.search).get('url');
      var ok = false;
      try {
        var u = new URL(target);
        ok = u.protocol === 'https:' && (u.hostname === 'zibal.ir' || /\.zibal\.ir$/.test(u.hostname));
      } catch (e) { ok = false; }
      if (ok) {
        location.replace(target);
      } else {
        document.getElementById('msg').textContent = 'آدرس درگاه معتبر نیست. به اپ پله برگرد و دوباره امتحان کن.';
      }
    })();
  </script>
</body>
</html>
